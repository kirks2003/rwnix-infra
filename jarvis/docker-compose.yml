services:
  neo4j:
    image: neo4j:5.26.31-community
    container_name: jarvis-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_ADMIN_PASSWORD:?Set NEO4J_ADMIN_PASSWORD in .env}"
      NEO4J_PLUGINS: '["apoc"]'
      # vm104 has ~100 GB RAM; keep the JVM small so the DB stays a guest.
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1g"
      NEO4J_server_memory_pagecache_size: "512m"
    volumes:
      - neo4j_data:/data
    # No published ports: only the compose network (the jarvis container) can
    # reach bolt 7687 / http 7474.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7474/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s
  jarvis:
    build: .
    container_name: jarvis
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "192.168.54.111:8094:8094"
    volumes:
      # The SQLite conversation database (CONVERSATION_DB_PATH points here):
      # the Prompt/Answer panels' history must survive container rebuilds.
      - jarvis_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8094/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  neo4j_data:
  jarvis_data:

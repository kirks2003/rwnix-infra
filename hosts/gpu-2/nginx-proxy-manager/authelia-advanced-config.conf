# Authelia auth_request protection — gpu-2 per-row advanced config template.
#
# gpu-2 delta vs nbg-1: nbg-1 ships this block as a GLOBAL NPM custom
# include (/data/nginx/custom/server_proxy[.]conf, 2026-09-21 SEC-03/G3).
# gpu-2's npm-ui already serves the POC proxy hosts (ds4-flash, data-ai-poc,
# agentic-ai-poc, chat-ai, neo4j-graph-viz), and a global include would
# Authelia-gate those rows too — breaking their API-key clients (the Jarvis
# brain's ds4-flash route first among them). So on gpu-2 this block is
# pasted VERBATIM into the advanced config of each service proxy host
# (auth, npm, portainer, grafana, glances, kuma, wetty, vikunja, kandev,
# jarvis) instead. The POC rows stay exactly as they are today.
#
# The content below is byte-identical to nbg-1's server_proxy.conf: same
# upstream (172.22.0.3 is authelia's fixed bridge IP on the authelia_shared
# network on both hosts), same unified 401 handling.
#
# Portal exception: the auth.<domain> portal host is not gated in practice
# because Authelia's access_control has a `bypass` rule for its domain (the
# subrequest returns 200, so no redirect) — see the authelia container's
# /config/configuration.yml. Do not add auth_request-specific handling here.
#
# New-host default: Authelia runs `default_policy: deny`, so a proxy host
# whose domain is not in the two_factor rule list is DENIED (403) —
# protected by default, fail-closed. Add the domain to the two_factor list
# (and restart authelia) to give it the normal two-factor login flow.
#
# Unified 401 handling: @authelia_or_basic distinguishes "Authelia rejected"
# (its 401 carries a Location header -> 302 to the portal) from "Basic Auth
# rejected" (auth_request never ran, no Location header -> plain 401 so the
# browser shows its WWW-Authenticate prompt). Authelia-only hosts only ever
# hit the 302 branch. (Collapsing both into a portal redirect is what caused
# the redirect loop in the old per-host setup.)
#
# 172.22.0.3 is authelia's fixed bridge IP on the `authelia_shared` network.

set $upstream_authelia http://172.22.0.3:9091/api/authz/auth-request;

auth_request /internal/authelia/authz;
satisfy all;

## Copy Authelia's identity metadata out of the subrequest response. The
## backends that want it inject it in their own location block via
## `proxy_set_header Remote-* $...` (per-host advanced_config).
auth_request_set $user $upstream_http_remote_user;
auth_request_set $groups $upstream_http_remote_groups;
auth_request_set $name $upstream_http_remote_name;
auth_request_set $email $upstream_http_remote_email;

## Modern redirect method: Authelia's 401 carries a Location header derived
## from session.cookies[].authelia_url, so the portal URL lives in Authelia's
## config rather than being hardcoded here.
auth_request_set $redirection_url $upstream_http_location;

error_page 401 = @authelia_or_basic;

location @authelia_or_basic {
    internal;

    ## This handler must not itself demand Basic Auth or run the auth
    ## subrequest, or it would recurse.
    auth_basic off;
    auth_request off;

    if ($redirection_url) {
        return 302 $redirection_url;
    }

    ## Otherwise Basic Auth is the layer that rejected. nginx's auth_basic
    ## handler has already put the WWW-Authenticate challenge on the response
    ## and an internal redirect does not clear it, so re-adding it here would
    ## only duplicate the header. Just re-emit the status.
    return 401;
}

location /internal/authelia/authz {
    internal;
    proxy_pass $upstream_authelia;

    ## Authelia is configured to authenticate on the session cookie alone.
    ## Strip any Authorization header belonging to the nginx Basic Auth layer
    ## sitting in front of this vhost, so Authelia never mistakes those
    ## credentials for an Authelia login attempt.
    proxy_set_header Authorization "";
    proxy_set_header Proxy-Authorization "";

    ## Headers. The X-* set is required: it is what Authelia matches
    ## access_control rules against.
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-Original-URL $scheme://$host$request_uri;
    proxy_set_header X-Forwarded-Method $request_method;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-URI $request_uri;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Content-Length "";
    proxy_set_header Connection "";

    ## Basic proxy configuration.
    proxy_pass_request_body off;
    proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
    proxy_redirect http:// $scheme://;
    proxy_http_version 1.1;
    proxy_cache_bypass $cookie_session;
    proxy_no_cache $cookie_session;
    proxy_buffers 4 32k;
    client_body_buffer_size 128k;

    ## Advanced proxy configuration.
    send_timeout 5m;
    proxy_read_timeout 240;
    proxy_send_timeout 240;
    proxy_connect_timeout 240;
}

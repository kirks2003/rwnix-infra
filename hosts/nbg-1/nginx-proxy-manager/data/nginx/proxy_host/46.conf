# ------------------------------------------------------------
# checkmk-gra-1.gw-1-nbg-1-de-netcup.rwnix.net
# ------------------------------------------------------------

map $scheme $hsts_header {
    https   "max-age=63072000; preload";
}

server {
  set $forward_scheme http;
  set $server         "192.168.116.11";
  set $port           5000;

  listen 80;
listen [::]:80;

listen 443 ssl;
listen [::]:443 ssl;

  server_name checkmk-gra-1.gw-1-nbg-1-de-netcup.rwnix.net;
http2 off;

  # Let's Encrypt SSL
  include conf.d/include/letsencrypt-acme-challenge.conf;
  include conf.d/include/ssl-cache.conf;
  include conf.d/include/ssl-ciphers.conf;
  ssl_certificate /etc/letsencrypt/live/npm-6/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/npm-6/privkey.pem;

  # Block Exploits
  include conf.d/include/block-exploits.conf;

    # Force SSL
    set $trust_forwarded_proto "F";
    include conf.d/include/force-ssl.conf;

proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $http_connection;
proxy_http_version 1.1;

  access_log /data/logs/proxy-host-46_access.log proxy;
  error_log /data/logs/proxy-host-46_error.log warn;

location / {
    include /snippets/proxy.conf;
    proxy_set_header Remote-User $user;
    proxy_set_header Remote-Groups $groups;
    proxy_set_header Remote-Name $name;
    proxy_set_header Remote-Email $email;
    proxy_pass $forward_scheme://$server:$port;
}

  # Custom
  include /data/nginx/custom/server_proxy[.]conf;
}

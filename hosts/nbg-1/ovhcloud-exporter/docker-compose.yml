services:
  ovhcloud-exporter:
    image: python:3.12-slim@sha256:44ff437bba879d4941b710a369a8f19266aea34b29002807f0c487fabc9eec9b
    container_name: ovhcloud-exporter
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      TZ: Europe/Berlin
      LISTEN_PORT: "8001"
      REFRESH_INTERVAL: "3600"
      NUM_INVOICES: "6"
      OVH_ENDPOINT: "https://eu.api.ovh.com/1.0"
      OVH_APP_KEY: "${OVH_APP_KEY}"
      OVH_APP_SECRET: "${OVH_APP_SECRET}"
      OVH_CONSUMER_KEY: "${OVH_CONSUMER_KEY}"
      OVH_CLOUD_PROJECT: "258291023b884da4bd7361ec6c774e0d"
    volumes:
      - ./exporter.py:/app/exporter.py:ro
    working_dir: /app
    command:
      - python3
      - /app/exporter.py
    restart: unless-stopped
    networks:
      grafana_private:
        ipv4_address: 172.27.0.4

networks:
  grafana_private:
    name: authelia_shared-grafana
    external: true

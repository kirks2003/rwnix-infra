services:
  openrouter-exporter:
    image: python:3.12-slim@sha256:44ff437bba879d4941b710a369a8f19266aea34b29002807f0c487fabc9eec9b
    container_name: openrouter-exporter
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      TZ: Europe/Berlin
      LISTEN_PORT: "8000"
      REFRESH_INTERVAL: "300"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
    volumes:
      - ./exporter.py:/app/exporter.py:ro
    working_dir: /app
    command:
      - python3
      - /app/exporter.py
    restart: unless-stopped
    networks:
      grafana_private:
        ipv4_address: 172.27.0.3

networks:
  grafana_private:
    name: authelia_shared-grafana
    external: true

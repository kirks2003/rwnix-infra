networks:
  kandev104:
    ipam:
      config:
      - subnet: 10.75.0.0/24
    name: kandev104
services:
  kandev:
    build:
      context: /home/ubuntu/docker/kandev104
      dockerfile: Dockerfile
    container_name: kandev104
    environment:
      KANDEV_AGENT_STANDALONE_PORT: '39429'
      KANDEV_CONSOLE_LOG_LEVEL: info
      KANDEV_HOME_DIR: /data
      KANDEV_LOG_LEVEL: info
      KANDEV_RESTART_ADAPTER: supervisor
      KANDEV_SERVER_PORT: '38429'
      KANDEV_SUPERVISOR_MANIFEST: /data/supervisor/launch.json
      KANDEV_SUPERVISOR_SOCKET: /data/supervisor/control.sock
      SHELL: /bin/bash
      TZ: Europe/Vienna
    hostname: kandev104
    image: kandev:v0.96.0-ssh
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    networks:
      kandev104:
        ipv4_address: 10.75.0.2
    ports:
    - 192.168.54.111:38431:38429
    - 127.0.0.1:2222:22
    pull_policy: build
    restart: unless-stopped
    volumes:
    - ./data:/data
    extra_hosts:

# StockSense — AI stock prediction platform. Upstream: upamanyu92/stocksense @ 470c50e.
# Deployed 2026-10-09. LLM backend: Ollama phi4-mini q8_0 on gpu-1, reached via
# https://ollama.gpu-1-ch-dk-2.nwfp-nwt-cdc-it.csdc-nm.at (NPM basic auth; the
# OLLAMA_AUTH credential lives only in the host-local .env, chmod 600).
# UI bound LAN-only (192.168.54.111:5005), same pattern as Jarvis (:8094).
#
# Local patch (host code at /home/ubuntu/docker/stocksense, not upstream):
# OLLAMA_AUTH env is sent as an Authorization header on the three Ollama call
# sites (app/config/ollama_config.py, app/models/ollama_model.py,
# app/api/system_routes.py) — upstream sends no auth.
#
# Changes vs upstream docker-compose.yml: LAN port bind, env_file, TZ,
# image tag (stocksense:470c50e), and removal of the `model_monitor` service —
# it is a phantom upstream: `scripts/model_monitor_scheduler.py` does not exist
# in the repo, and the Dockerfile entrypoint.sh runs `python3 -m app.main`
# unconditionally, so the container ran a duplicate Flask app instead of any
# scheduler. Scheduled work belongs to the main app's background worker
# (enable via admin UI if wanted).
services:
  predict_main:
    build:
      context: .
      dockerfile: Dockerfile
    image: stocksense:470c50e
    container_name: stocksense_main
    command: python3 -m app.main
    ports:
      - "192.168.54.111:5005:5005"
    volumes:
      - .:/app
      - ./app/db:/app/db
      - ./app/templates:/app/templates
      - ./model/saved_models:/app/model/saved_models
      - pip_cache:/root/.cache/pip
    env_file:
      - .env
    environment:
      - FLASK_ENV=development
      - PYTHONPATH=/app
      - TZ=Europe/Vienna
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python3", "-c", "import requests; requests.get('http://localhost:5005/health', timeout=5)" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  pip_cache:

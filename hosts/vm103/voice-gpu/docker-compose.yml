services:
  voice-gpu:
    container_name: voice-gpu
    image: python:3.12-slim
    restart: always
    working_dir: /app
    ports:
      - "192.168.53.111:8003:8000"
    environment:
      - TZ=Europe/Vienna
      - PYTHONUNBUFFERED=1
      - DEBIAN_FRONTEND=noninteractive
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./app.py:/app/app.py:ro
    command: >
      sh -c "apt-get update -qq && apt-get install -y -qq ffmpeg >/dev/null 2>&1
      && pip install -q --no-cache-dir fastapi uvicorn python-multipart httpx
      && uvicorn app:app --host 0.0.0.0 --port 8000"
networks:
  default:
    name: proxy
    external: true

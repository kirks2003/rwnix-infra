services:
  checkmk:
    image: "checkmk/check-mk-community:2.5.0-latest"
    container_name: "checkmk"
    environment:
      - CMK_PASSWORD=${CMK_PASSWORD}
      - TZ=Europe/Berlin
    volumes:
      - checkmk-data:/omd/sites
    tmpfs:
      - /opt/omd/sites/cmk/tmp:uid=1000,gid=1000
    ports:
      - "5000:5000"
      - "8001:8001"
    restart: unless-stopped

volumes:
  checkmk-data:

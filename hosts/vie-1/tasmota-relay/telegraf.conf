[agent]
  interval = "30s"
  flush_interval = "5s"
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["tele/+/SENSOR"]
  data_format = "json_v2"
  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "tasmota_energy"
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "ENERGY"

[[processors.regex]]
  [[processors.regex.tags]]
    key = "topic"
    pattern = "^tele/(.+)/SENSOR$"
    replacement = "${1}"
    result_key = "device"


services:
  wg-easy:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: ghcr.io/wg-easy/wg-easy:15.4.0@sha256:0e7bc9d34e86ddcaa92bc700d4d7dc9b33291dbc07ac8d13382f7c2095f949ec
    container_name: wg-easy
    network_mode: host
    cap_add:
    - NET_ADMIN
    - SYS_MODULE
    volumes:
    - ./data:/etc/wireguard
    - /lib/modules:/lib/modules:ro
    - /usr/local/sbin/wg-easy-host-firewall:/usr/local/sbin/wg-easy-host-firewall:ro
    - /usr/local/sbin/kandev-mesh-routing:/usr/local/sbin/kandev-mesh-routing:ro
    environment:
      HOST: 127.0.0.1
      PORT: '51821'
      INSECURE: 'true'
      DISABLE_IPV6: 'true'
      INIT_ENABLED: 'true'
      INIT_USERNAME: admin
      INIT_PASSWORD: ${WG_EASY_PASSWORD:?set WG_EASY_PASSWORD in .env}
      INIT_HOST: gw-1-vie-1-at-netcup.rwnix.net
      INIT_PORT: '51820'
      INIT_IPV4_CIDR: 10.2.1.0/24
      INIT_IPV6_CIDR: 2001:db8::/32
      INIT_ALLOWED_IPS: 10.2.1.0/24
    restart: unless-stopped

# Ollama — phi4-mini (q8_0) LLM backend for StockSense on vm104. Deployed 2026-10-09.
#
# - Host port bound to 127.0.0.1 only; the on-host nginx-proxy-manager
#   (network_mode: host) fronts it as https://ollama.gpu-1-ch-dk-2.nwfp-nwt-cdc-it.csdc-nm.at
#   with basic auth (Ollama has no native auth). Nothing is publicly exposed.
# - KEEP_ALIVE=24h keeps phi4-mini resident (~4.5 GB VRAM; ~21 GB headroom left on the GPU).
# - GUARDRAIL: do not stop/rebuild qwen38-27b-mtp-llamacpp or its NPM host
#   (qwen38-27b-mtp.*) — kandev sessions run on that model.
services:
  ollama:
    # pinned 20261009 (was ollama/ollama:latest)
    image: ollama/ollama@sha256:b86366bb528bbf7f1424435d165028497a5b69bf6ddb4fa5a87102e2b79f44fb
    container_name: ollama
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=0.0.0.0
      # Cap the default context: Ollama's vram-based default would size the KV
      # cache for 128K ctx (~16 GB) on this 96 GB GPU. 8K fits StockSense
      # prompts comfortably and keeps the load at ~4.5 GB total.
      - OLLAMA_CONTEXT_LENGTH=8192
      - OLLAMA_KEEP_ALIVE=24h
      - TZ=Europe/Vienna
    volumes:
      - ./models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    shm_size: 1gb
    healthcheck:
      test: [CMD, ollama, list]
      interval: 30s
      timeout: 10s
      retries: 3

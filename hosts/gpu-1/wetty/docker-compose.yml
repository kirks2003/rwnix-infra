services:
  wetty:
    image: wettyoss/wetty:2.5.0
    container_name: wetty
    restart: unless-stopped
    ports:
      - "3001:3000"
    command:
      - --base=/
      - --port=3000
      - --ssh-host=host.docker.internal
      - --ssh-port=22
      - --ssh-user=ubuntu
      - --ssh-auth=publickey
      - --ssh-key=/ssh/id_ed25519
    volumes:
      - ssh-key:/ssh:ro
      - ./known_hosts:/etc/ssh/ssh_known_hosts:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ssh-keygen:
    # pinned 20260902 (was alpine, build 2026-04-15)
    image: alpine@sha256:5b10f432ef3da1b8d4c7eb6c487f2f5a8f096bc91145e68878dd4a5019afde11
    container_name: wetty-keygen
    profiles:
      - setup
    command: >
      sh -c "
        if [ ! -f /ssh/id_ed25519 ]; then
          apk add --no-cache openssh-keygen &&
          ssh-keygen -t ed25519 -f /ssh/id_ed25519 -N '' &&
          cat /ssh/id_ed25519.pub
        else
          cat /ssh/id_ed25519.pub
        fi
      "
    volumes:
      - ssh-key:/ssh

volumes:
  ssh-key:
